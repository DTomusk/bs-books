basePath: /api
definitions:
  auth.AuthLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.AuthRegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  books.BookListResponse:
    description: Response containing a list of books
    properties:
      data:
        items:
          $ref: '#/definitions/queries.BookResponse'
        type: array
    type: object
  queries.BookResponse:
    properties:
      author_id:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  ratings.RatingRequest:
    properties:
      book_id:
        type: string
      heart_score:
        type: number
      poo_score:
        type: number
    type: object
  response.Error:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.Error'
      meta: {}
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API that will change the world
  title: BS Books API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with email and password
      parameters:
      - description: Login Request
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/auth.AuthLoginRequest'
      produces:
      - application/json
      responses: {}
      summary: Login a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Register Request
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/auth.AuthRegisterRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /books:
    get:
      consumes:
      - application/json
      description: Get a list of all books
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/books.BookListResponse'
            type: array
      summary: Get list of books
      tags:
      - books
  /ratings:
    post:
      consumes:
      - application/json
      description: Create a new rating for a book
      parameters:
      - description: Rating to create
        in: body
        name: rating
        required: true
        schema:
          $ref: '#/definitions/ratings.RatingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
      summary: Create a new rating
      tags:
      - ratings
swagger: "2.0"
