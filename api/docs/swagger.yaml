basePath: /api
definitions:
  auth.AuthLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.AuthRegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  books.AuthorSearchItem:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  books.BookDetailsResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/books.AuthorSearchItem'
        type: array
      id:
        type: string
      image_url:
        type: string
      synopsis:
        type: string
      title:
        type: string
    type: object
  content_moderation.ReportContentRequest:
    properties:
      content_id:
        type: string
      content_type:
        enum:
        - review
        type: string
      reason:
        type: string
    required:
    - content_id
    - content_type
    - reason
    type: object
  ratings.RatingRequest:
    properties:
      book_id:
        type: string
      heart_score:
        type: number
      poo_score:
        type: number
      review:
        type: string
    type: object
  response.Error:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.Error'
      meta: {}
    type: object
  response.PageMeta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  reviews.ReviewListingItem:
    properties:
      heart_score:
        type: number
      id:
        type: string
      poo_score:
        type: number
      text:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  reviews.ReviewListingResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/reviews.ReviewListingItem'
        type: array
      meta:
        $ref: '#/definitions/response.PageMeta'
    type: object
  search.AuthorSearchItem:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  search.BookSearchItem:
    properties:
      authors:
        items:
          $ref: '#/definitions/search.AuthorSearchItem'
        type: array
      id:
        type: string
      image_url:
        type: string
      similarity:
        type: number
      title:
        type: string
    type: object
  search.BookSearchResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/search.BookSearchItem'
        type: array
      meta:
        $ref: '#/definitions/response.PageMeta'
    type: object
  users.GetMeResponse:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API that will change the world
  title: BS Books API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with email and password
      parameters:
      - description: Login Request
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/auth.AuthLoginRequest'
      produces:
      - application/json
      responses: {}
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout a user by revoking their refresh token
      produces:
      - application/json
      responses: {}
      summary: Logout a user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh JWT token using refresh token cookie
      produces:
      - application/json
      responses: {}
      summary: Refresh JWT token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Register Request
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/auth.AuthRegisterRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /books/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve book details by its ID
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response
          schema:
            $ref: '#/definitions/books.BookDetailsResponse'
        "404":
          description: Book not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get Book by ID
      tags:
      - Books
  /books/{id}/reviews:
    get:
      consumes:
      - application/json
      description: Retrieve all reviews associated with a specific book
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/reviews.ReviewListingResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get reviews for a book
      tags:
      - reviews
  /books/search:
    get:
      consumes:
      - application/json
      description: Search for books by title
      parameters:
      - description: Search query
        in: query
        name: query
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/search.BookSearchResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Search Books
      tags:
      - Books
  /moderation/report:
    post:
      consumes:
      - application/json
      description: Report a review or user for inappropriate content or behavior
      parameters:
      - description: Report content request
        in: body
        name: report
        required: true
        schema:
          $ref: '#/definitions/content_moderation.ReportContentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Report inappropriate content
      tags:
      - Content Moderation
  /ratings:
    post:
      consumes:
      - application/json
      description: Create a new rating for a book
      parameters:
      - description: Rating to create
        in: body
        name: rating
        required: true
        schema:
          $ref: '#/definitions/ratings.RatingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: Create a new rating
      tags:
      - ratings
  /users/me:
    get:
      consumes:
      - application/json
      description: Get the currently authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.GetMeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT token in the format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
