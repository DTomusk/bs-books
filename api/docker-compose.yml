services:
  db: 
    image: postgres:18.1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bs_books
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bs_books"]
      interval: 10s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      db:
        condition: service_healthy
    command: [
      "-path", "/migrations",
      "-database", "postgres://user:password@db:5432/bs_books?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations

  api:
      build:
        context: .
        dockerfile: ./cmd/server/Dockerfile
      ports:
        - "8080:8080"
      env_file:
        - ./.env
      depends_on:
        db:
          condition: service_healthy
        migrate:
          condition: service_completed_successfully

  db_test:
    image: postgres:18.1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bs_books_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bs_books_test"]
      interval: 10s
      retries: 5

  migrate_test:
    image: migrate/migrate:v4.19.1
    depends_on:
      db_test:
        condition: service_healthy
    command: [
      "-path", "/migrations",
      "-database", "postgres://user:password@db_test:5432/bs_books_test?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations

  test_runner:
    build:
      context: .
      dockerfile: ./cmd/server/Dockerfile
      target: test
    depends_on:
      db_test:
        condition: service_healthy
      migrate_test:
        condition: service_completed_successfully
    environment:
      TEST_DB_URL: postgres://user:password@db_test:5432/bs_books_test?sslmode=disable
    command: ["go", "test", "./internal/...", "-v"]

volumes:
  db_data: