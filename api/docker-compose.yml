services:
  db: 
    image: postgres:18.1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bs_books
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bs_books"]
      interval: 10s
      retries: 5

  pgAdmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      db:
        condition: service_healthy
    command: [
      "-path", "/migrations",
      "-database", "postgres://user:password@db:5432/bs_books?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations

  api:
      build:
        context: .
        dockerfile: ./cmd/server/Dockerfile
      ports:
        - "8080:8080"
      env_file:
        - ./.env
      depends_on:
        db:
          condition: service_healthy
        migrate:
          condition: service_completed_successfully

volumes:
  db_data: