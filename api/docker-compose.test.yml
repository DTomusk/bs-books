services:
  db_test:
    image: postgres:18.1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bs_books_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bs_books_test"]
      interval: 2s
      retries: 10
    command: ["postgres", "-c", "fsync=off"]
    volumes:
      - db_test_data:/var/lib/postgresql

  migrate_test:
    image: migrate/migrate:v4.19.1
    depends_on:
      db_test:
        condition: service_healthy
    command: [
      "-path", "/migrations",
      "-database", "postgres://user:password@db_test:5432/bs_books_test?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations

  test_runner:
    build:
      context: .
      dockerfile: ./cmd/server/Dockerfile
      target: test
    depends_on:
      - migrate_test
    environment:
      TEST_DB_URL: postgres://user:password@db_test:5432/bs_books_test?sslmode=disable
    command: ["go", "test", "./internal/...", "-v"]

volumes:
  db_test_data:
