name: Backend tests

on: 
    pull_request:
        paths:
          - 'api/**'
    push:
        branches:
          - main
        paths:
          - 'api/**'

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Start Postgres
              run: |
                docker run -d --name db_test \
                -e POSTGRES_USER=user \
                -e POSTGRES_PASSWORD=password \
                -e POSTGRES_DB=bs_books_test \
                -p 5432:5432 \
                postgres:18.1

            - name: Wait for Postgres
              run: |
                until docker exec db_test pg_isready -U user -d bs_books_test; do sleep 1; done

            - name: Run migrations
              run: |
                docker run --rm --network host \
                -v ${{ github.workspace }}/migrations:/migrations \
                migrate/migrate:v4.19.1 \
                -path /migrations \
                -database postgres://user:password@localhost:5432/bs_books_test?sslmode=disable up

            - name: Run tests
              run: |
                docker build --target test -t api_test ./cmd/server
                docker run --rm --network host -e TEST_DB_URL=postgres://user:password@localhost:5432/bs_books_test?sslmode=disable api_test go test ./internal/... -v

            - name: Tear down Postgres
              run: docker rm -f db_test
